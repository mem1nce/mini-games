<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Minik Oyunlar simgesinin ön planı (saydam zemin). Karakterler ortadaki güvenli alanda
       (yarıçap ~170) kalır; Android uyarlanabilir simgesinde maske onları kesmez. -->
  <defs>
    <radialGradient id="k_diken" gradientUnits="userSpaceOnUse" cx="100" cy="80" r="150">
      <stop offset="0" stop-color="#BE8C5E"/>
      <stop offset="0.55" stop-color="#8A5A36"/>
      <stop offset="1" stop-color="#5A361E"/>
    </radialGradient>
    <radialGradient id="k_yuz" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFF6EA"/>
      <stop offset="0.6" stop-color="#FCDDB8"/>
      <stop offset="1" stop-color="#EBBC8A"/>
    </radialGradient>
    <radialGradient id="k_burun" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7A5A4A"/>
      <stop offset="1" stop-color="#21130C"/>
    </radialGradient>
    <radialGradient id="k_goz" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6A5A96"/>
      <stop offset="0.55" stop-color="#2A1F45"/>
      <stop offset="1" stop-color="#150F26"/>
    </radialGradient>
    <radialGradient id="k_yanak" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7FA3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF7FA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="k_ayak" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#A06A44"/>
      <stop offset="1" stop-color="#4E2E18"/>
    </radialGradient>
    <linearGradient id="s_hasir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C47E"/>
      <stop offset="1" stop-color="#C4843C"/>
    </linearGradient>
    <radialGradient id="s_elma" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FF9AAA"/>
      <stop offset="1" stop-color="#D81E3A"/>
    </radialGradient>
    <radialGradient id="s_portakal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFE3A6"/>
      <stop offset="1" stop-color="#EE7410"/>
    </radialGradient>
    <radialGradient id="b_cam" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E4F1FF"/>
      <stop offset="1" stop-color="#A9C8F5"/>
    </radialGradient>
    <radialGradient id="b_isik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6B0" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFF6B0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="b_ic"><circle cx="50" cy="50" r="44"/></clipPath>
  </defs>

  <!-- Arka ayak -->
  <ellipse cx="220" cy="416" rx="24" ry="13" fill="url(#k_ayak)" stroke="#2E1A0C" stroke-width="5"/>


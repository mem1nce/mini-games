    <g fill="url(#k_yuz)">
      <ellipse cx="150" cy="160" rx="76" ry="62"/>
      <ellipse cx="214" cy="166" rx="34" ry="23"/>
    </g>
    <ellipse cx="128" cy="122" rx="22" ry="9" transform="rotate(-15 128 122)" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="244" cy="161" r="11" fill="url(#k_burun)"/>
    <ellipse cx="240" cy="157" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="150" cy="142" rx="12" ry="15" fill="url(#k_goz)"/>
    <ellipse cx="190" cy="140" rx="12" ry="15" fill="url(#k_goz)"/>
    <ellipse cx="146" cy="135" rx="5" ry="6" fill="#FFFFFF"/>
    <ellipse cx="186" cy="133" rx="5" ry="6" fill="#FFFFFF"/>
    <circle cx="154" cy="148" r="2.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="194" cy="146" r="2.5" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="130" cy="170" rx="15" ry="10" fill="url(#k_yanak)"/>
    <ellipse cx="198" cy="184" rx="12" ry="8" fill="url(#k_yanak)"/>
    <path d="M204 186 Q213 194 223 187" fill="none" stroke="#3E2412" stroke-width="4" stroke-linecap="round"/>
  </g>


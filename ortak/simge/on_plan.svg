    <path d="M58 78 L70 92 M84 56 L92 74 M114 48 L118 70 M146 52 L142 72 M174 64 L164 80 M36 112 L54 118 M30 146 L50 148 M198 86 L184 96" fill="none" stroke="#DDAE7E" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="174" cy="100" r="13" fill="url(#k_yuz)" stroke="#3E2412" stroke-width="5"/>
    <circle cx="174" cy="101" r="6" fill="#F7A9B8"/>
    <g fill="url(#k_yuz)" stroke="#3E2412" stroke-width="12">

    <circle cx="50" cy="50" r="24" fill="url(#b_isik)"/>
    <path d="M50 37 L53.23 45.55 L62.36 45.98 L55.23 51.7 L57.64 60.52 L50 55.5 L42.36 60.52 L44.77 51.7 L37.64 45.98 L46.77 45.55 Z" fill="#FFFFFF" stroke="#FFC93D" stroke-width="2" stroke-linejoin="round"/>

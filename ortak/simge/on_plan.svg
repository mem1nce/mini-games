    <circle cx="50" cy="50" r="45" fill="none" stroke="#3B2F6B" stroke-width="5"/>
  </g>

  <!-- Işıltılar -->
  <g fill="#FFFFFF">
    <path d="M132 146 C134 158 138 162 150 164 C138 166 134 170 132 182 C130 170 126 166 114 164 C126 162 130 158 132 146 Z"/>
    <path d="M392 300 C393.5 309 396 311.5 405 313 C396 314.5 393.5 317 392 326 C390.5 317 388 314.5 379 313 C388 311.5 390.5 309 392 300 Z"/>
  </g>

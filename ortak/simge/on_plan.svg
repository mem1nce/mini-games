    <circle cx="54" cy="46" r="18" fill="url(#s_elma)" stroke="#7E0F24" stroke-width="4"/>
    <circle cx="86" cy="44" r="17" fill="url(#s_portakal)" stroke="#9A4A06" stroke-width="4"/>
    <path d="M54 30 Q52 22 58 18" fill="none" stroke="#4A2E12" stroke-width="4" stroke-linecap="round"/>
    <path d="M14 54 A56 13 0 0 0 126 54 L114 104 Q112 112 104 112 L36 112 Q28 112 26 104 Z" fill="url(#s_hasir)" stroke="#6B3E14" stroke-width="5" stroke-linejoin="round"/>
    <path d="M22 74 H118 M26 92 H114" stroke="#A0642A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M14 54 A56 13 0 0 0 126 54" fill="none" stroke="#6B3E14" stroke-width="12" stroke-linecap="round"/>
    <path d="M14 54 A56 13 0 0 0 126 54" fill="none" stroke="#E2B064" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Uçan kuş -->
  <g transform="translate(330 86) scale(0.72)">
    <path d="M30 62 L6 46 Q12 62 6 78 Z" fill="#8E5CF2" stroke="#3B3585" stroke-width="4" stroke-linejoin="round"/>
    <path d="M66 28 Q58 8 70 4 Q70 16 75 24 Q80 8 94 11 Q84 18 82 30 Z" fill="#B36BFF" stroke="#3B3585" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="68" cy="66" rx="46" ry="42" fill="#6C7BFF" stroke="#3B3585" stroke-width="4"/>
    <ellipse cx="78" cy="84" rx="28" ry="19" fill="#C9D6FF"/>
    <circle cx="104" cy="75" r="7" fill="#FF9EC7"/>
    <ellipse cx="92" cy="52" rx="17" ry="19" fill="#FFFFFF" stroke="#3B3585" stroke-width="3"/>
    <circle cx="96" cy="55" r="10" fill="#1F1B3F"/>
    <circle cx="100" cy="50" r="4" fill="#FFFFFF"/>
    <path d="M112 62 L126 67 L112 72 Z" fill="#FF8FB8" stroke="#3B3585" stroke-width="3" stroke-linejoin="round"/>
    <g transform="rotate(30 64 70)">
      <ellipse cx="48" cy="70" rx="20" ry="11" fill="#8E5CF2" stroke="#3B3585" stroke-width="4"/>
    </g>
  </g>

  <!-- Cam bilye -->
  <g transform="translate(116 348) scale(0.66)">
    <circle cx="50" cy="50" r="45" fill="url(#b_cam)"/>
    <g clip-path="url(#b_ic)" opacity="0.75">
      <path d="M50 50 C58 36 74 28 96 34 C82 44 66 50 50 50 Z" fill="#FF5A5A"/>
      <path d="M50 50 C58 36 74 28 96 34 C82 44 66 50 50 50 Z" transform="rotate(60 50 50)" fill="#FF9F40"/>
      <path d="M50 50 C58 36 74 28 96 34 C82 44 66 50 50 50 Z" transform="rotate(120 50 50)" fill="#FFD93D"/>
      <path d="M50 50 C58 36 74 28 96 34 C82 44 66 50 50 50 Z" transform="rotate(180 50 50)" fill="#6BD66B"/>
      <path d="M50 50 C58 36 74 28 96 34 C82 44 66 50 50 50 Z" transform="rotate(240 50 50)" fill="#4FA8FF"/>
      <path d="M50 50 C58 36 74 28 96 34 C82 44 66 50 50 50 Z" transform="rotate(300 50 50)" fill="#A66BFF"/>

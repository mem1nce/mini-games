  <rect x="18" y="220" width="104" height="26" fill="#DCDCDC"/>
  <rect x="18" y="420" width="104" height="26" fill="#DCDCDC"/>
  <rect x="18" y="620" width="104" height="26" fill="#DCDCDC"/>
  <rect x="18" y="820" width="104" height="26" fill="#DCDCDC"/>
  <rect x="18" y="1020" width="104" height="26" fill="#DCDCDC"/>
  <rect x="18" y="1220" width="104" height="26" fill="#DCDCDC"/>
  <!-- Parlaklık ve gölge şeritleri -->
  <rect x="32" y="80" width="16" height="1340" rx="8" fill="#FFFFFF"/>
  <rect x="98" y="80" width="16" height="1340" rx="8" fill="#D2D2D2"/>
  <!-- Gövde çerçevesi -->
  <rect x="18" y="40" width="104" height="1380" rx="20" fill="none" stroke="#8C8C8C" stroke-width="5"/>
  <!-- Yuvarlak başlık -->

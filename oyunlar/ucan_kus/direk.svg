<svg xmlns="http://www.w3.org/2000/svg" width="140" height="1400" viewBox="0 0 140 1400">
  <!-- Direk beyaz/gri çizildi; oyunda modulate ile renklendiriliyor -->
  <!-- Boşluğa bakan ucu yuvarlak, başlıksız (dudaksız) düz sütun: genişliği çarpışma alanıyla aynı (120 px) -->
  <!-- Gövde -->
  <rect x="10" y="4" width="120" height="1420" rx="46" fill="#F2F2F2"/>
  <!-- Süs bantları -->
  <rect x="10" y="220" width="120" height="26" fill="#DCDCDC"/>
  <rect x="10" y="420" width="120" height="26" fill="#DCDCDC"/>
  <rect x="10" y="620" width="120" height="26" fill="#DCDCDC"/>
  <rect x="10" y="820" width="120" height="26" fill="#DCDCDC"/>
  <rect x="10" y="1020" width="120" height="26" fill="#DCDCDC"/>
  <rect x="10" y="1220" width="120" height="26" fill="#DCDCDC"/>
  <!-- Parlaklık ve gölge şeritleri -->
  <rect x="26" y="150" width="16" height="1270" rx="8" fill="#FFFFFF"/>
  <rect x="100" y="150" width="16" height="1270" rx="8" fill="#D2D2D2"/>
  <!-- Uçtaki süs: ince halka, üç nokta ve küçük parlaklık -->
  <rect x="10" y="108" width="120" height="14" fill="#DCDCDC"/>
  <circle cx="42" cy="72" r="8" fill="#D2D2D2"/>
  <circle cx="70" cy="72" r="8" fill="#D2D2D2"/>
  <circle cx="98" cy="72" r="8" fill="#D2D2D2"/>
  <path d="M38 34 C46 22 62 18 76 18" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <!-- Gövde çerçevesi -->
  <rect x="10" y="4" width="120" height="1420" rx="46" fill="none" stroke="#8C8C8C" stroke-width="6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Kurbağa gövdesi (yüzsüz). Önce kalın dış hatlar, sonra dolgular: şekiller tek parça görünür.
       Göz akları gövdede; göz bebekleri, ağız ve kapaklar kurbaga_yuz_*.svg içinde (aynı tuval). -->
  <defs>
    <radialGradient id="ten" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#B8F58A"/>
      <stop offset="0.5" stop-color="#6FD35A"/>
      <stop offset="1" stop-color="#3C9E44"/>
    </radialGradient>
    <radialGradient id="gozten" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#C4F79A"/>
      <stop offset="0.6" stop-color="#78D862"/>
      <stop offset="1" stop-color="#4FB04C"/>
    </radialGradient>
    <linearGradient id="karin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFFD6"/>
      <stop offset="1" stop-color="#DDF3A0"/>
    </linearGradient>
    <radialGradient id="yanak" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7FA3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FF7FA3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Dış hat -->
  <g fill="#3B2F6B" stroke="#3B2F6B" stroke-width="14" stroke-linejoin="round">
    <ellipse cx="128" cy="168" rx="88" ry="64"/>
    <circle cx="82" cy="98" r="36"/>
    <circle cx="174" cy="98" r="36"/>
    <ellipse cx="94" cy="228" rx="22" ry="10"/>
    <ellipse cx="162" cy="228" rx="22" ry="10"/>
  </g>
  <!-- Dolgular -->
  <g fill="url(#ten)">
    <ellipse cx="94" cy="228" rx="22" ry="10"/>
    <ellipse cx="162" cy="228" rx="22" ry="10"/>
    <ellipse cx="128" cy="168" rx="88" ry="64"/>
  </g>
  <circle cx="82" cy="98" r="36" fill="url(#gozten)"/>
  <circle cx="174" cy="98" r="36" fill="url(#gozten)"/>
  <!-- Ön ayak parmak çizgileri -->
  <g fill="none" stroke="#3B2F6B" stroke-width="3.5" stroke-linecap="round">
    <path d="M86 224 V232 M100 224 V232 M156 224 V232 M170 224 V232"/>
  </g>
  <!-- Karın -->
  <ellipse cx="128" cy="192" rx="56" ry="34" fill="url(#karin)"/>
  <!-- Sırttaki benekler -->
  <g fill="#4FAE45" opacity="0.8">
    <circle cx="190" cy="150" r="9"/><circle cx="206" cy="176" r="6"/><circle cx="60" cy="176" r="7"/>
  </g>
  <!-- Göz akları -->
  <g fill="#FFFFFF" stroke="#3B2F6B" stroke-width="4">
    <circle cx="82" cy="100" r="25"/>
    <circle cx="174" cy="100" r="25"/>
  </g>
  <!-- Yanaklar -->
  <ellipse cx="64" cy="164" rx="18" ry="11" fill="url(#yanak)"/>
  <ellipse cx="192" cy="164" rx="18" ry="11" fill="url(#yanak)"/>
  <!-- Parlamalar -->
  <ellipse cx="86" cy="134" rx="22" ry="8" transform="rotate(-18 86 134)" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="62" cy="72" rx="9" ry="5" transform="rotate(-35 62 72)" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="156" cy="72" rx="9" ry="5" transform="rotate(-35 156 72)" fill="#FFFFFF" opacity="0.8"/>
</svg>

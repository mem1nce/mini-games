<svg xmlns="http://www.w3.org/2000/svg" width="256" height="300" viewBox="0 0 256 300">
  <!-- Köstebek gövdesi (yüzsüz). Yüzler, kask ve kask parçaları aynı 256x300 tuvalde üst üste oturur.
       y=260 çizgisi çukurun ağız çizgisine denk gelir. -->
  <defs>
    <radialGradient id="kurk" cx="0.38" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#C39A78"/>
      <stop offset="0.5" stop-color="#9A6E4E"/>
      <stop offset="1" stop-color="#6A4630"/>
    </radialGradient>
    <radialGradient id="gobek" cx="0.45" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF3E2"/>
      <stop offset="1" stop-color="#EBCBA4"/>
    </radialGradient>
    <radialGradient id="burun" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFC4D4"/>
      <stop offset="0.55" stop-color="#FF7FA3"/>
      <stop offset="1" stop-color="#E0527C"/>
    </radialGradient>
    <radialGradient id="pati" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFE0E0"/>
      <stop offset="1" stop-color="#F2A8A8"/>
    </radialGradient>
    <radialGradient id="yanak" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7FA3" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FF7FA3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Gövde -->
  <path d="M34 300 L34 150 C34 66 82 22 128 22 C174 22 222 66 222 150 L222 300 Z" fill="url(#kurk)" stroke="#3E2412" stroke-width="7" stroke-linejoin="round"/>
  <!-- Göbek -->
  <path d="M72 300 L72 222 C72 190 98 172 128 172 C158 172 184 190 184 222 L184 300 Z" fill="url(#gobek)" opacity="0.9"/>
  <!-- Kulaklar (başın yanlarında küçük) -->
  <ellipse cx="44" cy="92" rx="13" ry="16" fill="#8A5E40" stroke="#3E2412" stroke-width="5"/>
  <ellipse cx="212" cy="92" rx="13" ry="16" fill="#8A5E40" stroke="#3E2412" stroke-width="5"/>
  <ellipse cx="45" cy="93" rx="6" ry="8" fill="#F7A9B8"/>
  <ellipse cx="211" cy="93" rx="6" ry="8" fill="#F7A9B8"/>
  <!-- Parlama -->
  <ellipse cx="92" cy="58" rx="24" ry="10" transform="rotate(-28 92 58)" fill="#FFFFFF" opacity="0.35"/>
  <!-- Yanaklar -->
  <ellipse cx="70" cy="150" rx="17" ry="11" fill="url(#yanak)"/>
  <ellipse cx="186" cy="150" rx="17" ry="11" fill="url(#yanak)"/>
  <!-- Ağız çevresi -->
  <ellipse cx="128" cy="160" rx="46" ry="34" fill="url(#gobek)" stroke="#3E2412" stroke-width="5"/>
  <!-- Bıyıklar -->
  <g fill="none" stroke="#3E2412" stroke-width="3.5" stroke-linecap="round" opacity="0.75">
    <path d="M86 150 L58 144 M86 160 L56 162"/>
    <path d="M170 150 L198 144 M170 160 L200 162"/>
  </g>
  <!-- Burun -->
  <ellipse cx="128" cy="142" rx="24" ry="17" fill="url(#burun)" stroke="#8A2446" stroke-width="5"/>
  <ellipse cx="119" cy="136" rx="8" ry="4.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- Patiler: çukurun kenarına dayanır -->
  <g stroke="#3E2412" stroke-width="5" stroke-linejoin="round">
    <path d="M30 256 C26 230 50 216 72 222 C92 228 96 250 86 262 Z" fill="url(#pati)"/>
    <path d="M226 256 C230 230 206 216 184 222 C164 228 160 250 170 262 Z" fill="url(#pati)"/>
  </g>
  <g fill="none" stroke="#B8706E" stroke-width="3.5" stroke-linecap="round">
    <path d="M46 244 L44 256 M60 240 L60 256 M74 242 L76 256"/>
    <path d="M210 244 L212 256 M196 240 L196 256 M182 242 L180 256"/>
  </g>
</svg>

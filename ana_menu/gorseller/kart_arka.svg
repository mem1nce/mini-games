  <circle cx="120" cy="144" r="62" fill="url(#isik)"/>
  <circle cx="120" cy="144" r="46" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M120 106 L129.4 131.1 L156.1 132.3 L135.2 148.9 L142.3 174.7 L120 160 L97.7 174.7 L104.8 148.9 L83.9 132.3 L110.6 131.1 Z" fill="url(#yildiz)" stroke="#B8641A" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="111" cy="128" rx="6" ry="4" transform="rotate(-30 111 128)" fill="#FFFFFF" opacity="0.85"/>
  <!-- Işıltılar -->

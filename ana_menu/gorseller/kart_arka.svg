    <use xlink:href="#pati" transform="translate(190 56) rotate(-10)"/>
    <use xlink:href="#pati" transform="translate(36 120) rotate(25)"/>
    <use xlink:href="#pati" transform="translate(206 126) rotate(-25)"/>
    <use xlink:href="#pati" transform="translate(40 196) rotate(10)"/>
    <use xlink:href="#pati" transform="translate(200 206) rotate(20)"/>
    <use xlink:href="#pati" transform="translate(78 250) rotate(-15)"/>
    <use xlink:href="#pati" transform="translate(150 256) rotate(10)"/>
    <use xlink:href="#pati" transform="translate(118 228) rotate(-5) scale(0.8)"/>

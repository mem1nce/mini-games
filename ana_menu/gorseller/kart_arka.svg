<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="288" viewBox="0 0 240 288">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB36B"/>
      <stop offset="0.5" stop-color="#FF7A6B"/>
      <stop offset="1" stop-color="#F0578C"/>
    </linearGradient>
    <radialGradient id="yildiz" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FFFBD0"/>
      <stop offset="0.5" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#F5A623"/>
    </radialGradient>
    <radialGradient id="isik" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ic"><rect x="16" y="16" width="208" height="256" rx="22"/></clipPath>
    <g id="pati">
      <ellipse cx="0" cy="6" rx="10" ry="8"/>
      <circle cx="-10" cy="-6" r="4.5"/><circle cx="-3.5" cy="-11.5" r="4.5"/>
      <circle cx="3.5" cy="-11.5" r="4.5"/><circle cx="10" cy="-6" r="4.5"/>
    </g>
  </defs>
  <!-- Beyaz çerçeve ve renkli iç -->
  <rect x="4" y="4" width="232" height="280" rx="30" fill="#FFFFFF" stroke="#C94A5A" stroke-width="5"/>
  <rect x="16" y="16" width="208" height="256" rx="22" fill="url(#zemin)"/>
  <!-- Pati izi deseni -->

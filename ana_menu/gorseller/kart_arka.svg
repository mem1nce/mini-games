    <path d="M186 96 C187 102 189 104 195 105 C189 106 187 108 186 114 C185 108 183 106 177 105 C183 104 185 102 186 96 Z"/>
    <path d="M56 176 C57 181 59 183 64 184 C59 185 57 187 56 192 C55 187 53 185 48 184 C53 183 55 181 56 176 Z"/>
